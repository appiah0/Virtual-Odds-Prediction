<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>INSTANTVIRTUALS - Virtual football odds reader</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { display: ['Outfit','sans-serif'], sans: ['Plus Jakarta Sans','sans-serif'] } } } };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p1:#a855f7;--p2:#7c3aed;--ink:#0f1226;--mute:#6b7280;--line:#e6e8f2;--soft:#f5f3ff}
*{-webkit-tap-highlight-color:transparent}
html,body{background:#fff;color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif}
.font-display{font-family:'Outfit',sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:0 20px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:22px}
.grad{background:linear-gradient(135deg,var(--p1),var(--p2))}
.grad-text{background:linear-gradient(90deg,#7c3aed,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Outfit',sans-serif;font-weight:700;border-radius:999px;padding:15px 24px;transition:transform .15s;cursor:pointer;border:0}
.btn:active{transform:scale(.97)}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 10px 24px -8px rgba(124,58,237,.6)}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid #d6d9e6}
.btn-green{color:#fff;background:linear-gradient(135deg,#10b981,#047857)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:#f3f5fa;border:1px solid var(--line)}
.input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--p2);box-shadow:0 0 0 4px rgba(124,58,237,.12)}
.label{font-size:13px;font-weight:700;margin-bottom:6px;display:block;color:#374151}
.dark-card{background:linear-gradient(135deg,#0f1226,#1e1b4b);color:#fff;border-radius:24px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#7c3aed}
.i{width:18px;height:18px;stroke-width:2.2}
.i-lg{width:22px;height:22px}
.star-on{color:#f59e0b;fill:#f59e0b}
.star-off{color:#d1d5db}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:10.5px;font-weight:600;color:#8b90a5}
.nav a.on{color:var(--p2)}
.nav a.on .pill{background:#ede9fe}
.pill{padding:4px 14px;border-radius:999px;display:flex}
.bar{height:9px;border-radius:999px;background:#eceef6;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;transition:width .5s}
.faq-a{display:none}.faq.open .faq-a{display:block}.faq.open .chev{transform:rotate(180deg)}
.chev{transition:transform .2s}
.drop{border:2px dashed #c4b5fd;background:var(--soft);border-radius:22px}
.drop.over{background:#ede9fe;border-color:var(--p2)}
.tag{position:absolute;top:-11px;left:16px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#fff;padding:3px 12px;border-radius:8px 8px 8px 0;background:linear-gradient(135deg,var(--p1),var(--p2))}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:#0f1226;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:100;transition:transform .3s;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.status-pending{background:#fef3c7;color:#92400e}.status-successful{background:#d1fae5;color:#065f46}.status-failed{background:#fee2e2;color:#991b1b}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid #c4b5fd;outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   CONFIG - fill in the Supabase values (the anon key is public by design).
   The Claude API key is NOT here. It lives in a Supabase Edge Function secret.
   ========================================================= */
const CONFIG = {
  brand: 'INSTANTVIRTUALS',
  SUPABASE_URL: 'https://YOUR-PROJECT.supabase.co',
  SUPABASE_ANON_KEY: 'YOUR-ANON-KEY',
  momo: {
    'MTN MoMo':     { number: '0XX XXX XXXX', name: 'Account name' },
    'Telecel Cash': { number: '0XX XXX XXXX', name: 'Account name' },
    'AT Money':     { number: '0XX XXX XXXX', name: 'Account name' }
  },
  support: { email: 'support@yourdomain.com', whatsapp: '233XXXXXXXXX', telegram: 'YourTelegramHandle' },
  lobbyUrl: 'https://www.sportybet.com/gh/'
};
const CONFIGURED = !CONFIG.SUPABASE_URL.includes('YOUR-PROJECT');

/* Display copy for tiers. The server (scan-odds function) holds the authoritative costs and match limits. */
const TIERS = {
  coins: [
    { id: 'bronze',     name: 'Bronze',     amount: 1000, n: 1, desc: 'Single match reading',  icon: 'shield',        tile: 'linear-gradient(135deg,#fde68a,#fbbf24)', fg: '#b45309' },
    { id: 'silver_pro', name: 'Silver Pro', amount: 2500, n: 2, desc: 'Match outcome readings', icon: 'medal',         tile: 'linear-gradient(135deg,#fde68a,#f59e0b)', fg: '#92400e', tag: 'POPULAR' },
    { id: 'gold_ultra', name: 'Gold Ultra', amount: 5000, n: 5, desc: 'Match readings combo',   icon: 'crown',         tile: 'linear-gradient(135deg,#fbbf24,#d97706)', fg: '#fff' }
  ],
  diamonds: [
    { id: 'silver_vip', name: 'Silver VIP', amount: 20, n: 1, desc: 'Single match reading, detailed',  icon: 'gem',           tile: 'linear-gradient(135deg,#ede9fe,#c4b5fd)', fg: '#7c3aed' },
    { id: 'gold_vip',   name: 'Gold VIP',   amount: 40, n: 2, desc: 'Match readings, detailed',        icon: 'crown',         tile: 'linear-gradient(135deg,#a855f7,#7c3aed)', fg: '#fff', tag: 'VIP BEST' },
    { id: 'master_vip', name: 'Master VIP', amount: 80, n: 5, desc: 'Match readings, detailed',        icon: 'wand-sparkles', tile: 'linear-gradient(135deg,#f43f5e,#be123c)', fg: '#fff' }
  ]
};
const COIN_PACKS = [
  { id: 'starter', name: 'Starter Coins Pack', price: 350,  amount: '1,000 coins' },
  { id: 'pro',     name: 'Pro Coins Pack',     price: 700,  amount: '2,500 coins', popular: true },
  { id: 'mega',    name: 'Mega Coins Pack',    price: 1200, amount: '5,000 coins' }
];
const DIAMOND_PACKS = [
  { id: 'd20', name: 'Silver Diamonds Pack', price: 500,  amount: '20 diamonds' },
  { id: 'd40', name: 'Gold Diamonds Pack',   price: 1000, amount: '40 diamonds', popular: true },
  { id: 'd80', name: 'Master Diamonds Pack', price: 2000, amount: '80 diamonds' }
];

/* =========================================================
   Helpers
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, c = '') => `<i data-lucide="${n}" class="i ${c}"></i>`;
const money = n => 'GH\u20B5 ' + Number(n || 0).toLocaleString('en-GH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = t => new Date(t).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200); }
function normPhone(p) { let d = String(p).replace(/\D/g, ''); if (d.startsWith('233')) d = d.slice(3); if (d.startsWith('0')) d = d.slice(1); return d; }
const msg = e => (typeof e === 'string' ? e : e?.message || 'Something went wrong.');

/* =========================================================
   Supabase client. "Remember me" decides localStorage vs sessionStorage.
   ========================================================= */
const adapter = {
  getItem: k => localStorage.getItem(k) ?? sessionStorage.getItem(k),
  setItem: (k, v) => {
    if (localStorage.getItem('iv_remember') === '0') { sessionStorage.setItem(k, v); localStorage.removeItem(k); }
    else { localStorage.setItem(k, v); sessionStorage.removeItem(k); }
  },
  removeItem: k => { localStorage.removeItem(k); sessionStorage.removeItem(k); }
};
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
  auth: { storage: adapter, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' }
});
async function session() { const { data } = await sb.auth.getSession(); return data.session; }
async function callFn(name, body, authed = true) {
  const s = authed ? await session() : null;
  const res = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${name}`, {
    method: 'POST',
    headers: { 'content-type': 'application/json', apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + (s ? s.access_token : CONFIG.SUPABASE_ANON_KEY) },
    body: JSON.stringify(body)
  });
  let data = {}; try { data = await res.json(); } catch {}
  if (!res.ok) throw data.error || ('Request failed (' + res.status + ').');
  return data;
}

/* =========================================================
   State and data
   ========================================================= */
const state = { me: null, reviews: [], packTab: 'coins', depNetwork: 'MTN MoMo', txFilter: 'all', reviewRating: 0, reviewDraft: '' };
const P = { step: 'tiers', kind: 'coins', tier: null, dataUrl: null, error: '', scanId: null, fixtures: [], picks: [], allowed: 0, result: null, resultKind: 'coins' };

async function loadMe() {
  const s = await session();
  if (!s) { state.me = null; return null; }
  const [p, t, sc] = await Promise.all([
    sb.from('profiles').select('*').eq('id', s.user.id).maybeSingle(),
    sb.from('transactions').select('*').order('created_at', { ascending: false }).limit(100),
    sb.from('scans').select('id,tier,allowed,created_at').order('created_at', { ascending: false }).limit(5)
  ]);
  if (!p.data) { state.me = null; return null; }
  state.me = { email: s.user.email, ...p.data, cash: Number(p.data.cash), tx: t.data || [], scans: sc.data || [] };
  return state.me;
}
async function loadReviews() {
  const { data } = await sb.from('reviews').select('display_name,rating,comment,created_at').order('created_at', { ascending: false }).limit(30);
  state.reviews = data || [];
}

const Auth = {
  async register(f) {
    const email = f.email.trim().toLowerCase(), phone = normPhone(f.phone);
    if (!f.first.trim() || !f.last.trim()) throw 'Enter your first name and surname.';
    if (!/^\S+@\S+\.\S+$/.test(email)) throw 'Enter a valid email address.';
    if (phone.length !== 9) throw 'Enter a valid Ghana phone number (9 digits after +233).';
    if (f.password.length < 6) throw 'Password must be at least 6 characters.';
    if (f.password !== f.confirm) throw 'Passwords do not match.';
    if (!f.terms) throw 'Please accept the Terms & Conditions.';
    if (!CONFIGURED) throw 'Supabase is not configured yet. Add your project URL and anon key in CONFIG.';
    localStorage.setItem('iv_remember', '1');
    const { data, error } = await sb.auth.signUp({
      email, password: f.password,
      options: { data: { first_name: f.first.trim(), other_name: f.other.trim(), last_name: f.last.trim(), phone, referral: f.referral.trim() }, emailRedirectTo: location.origin + location.pathname }
    });
    if (error) {
      if (/database error/i.test(error.message)) throw 'That phone number is already registered.';
      throw /registered/i.test(error.message) ? 'An account with this email already exists.' : error.message;
    }
    return !!data.session;
  },
  async login(identifier, password, remember) {
    if (!CONFIGURED) throw 'Supabase is not configured yet. Add your project URL and anon key in CONFIG.';
    localStorage.setItem('iv_remember', remember ? '1' : '0');
    const id = identifier.trim();
    if (id.includes('@')) {
      const { error } = await sb.auth.signInWithPassword({ email: id.toLowerCase(), password });
      if (error) throw error.message.includes('confirm') ? 'Confirm your email first, then sign in.' : 'Incorrect phone/email or password.';
    } else {
      const r = await callFn('phone-login', { phone: normPhone(id), password }, false);
      const { error } = await sb.auth.setSession({ access_token: r.access_token, refresh_token: r.refresh_token });
      if (error) throw 'Incorrect phone/email or password.';
    }
    remember ? localStorage.setItem('iv_last_login', id) : localStorage.removeItem('iv_last_login');
  },
  async reset(email) {
    const { error } = await sb.auth.resetPasswordForEmail(email.trim().toLowerCase(), { redirectTo: location.origin + location.pathname });
    if (error) throw error.message;
  },
  async logout() { await sb.auth.signOut(); state.me = null; location.hash = '#/'; render(); }
};

/* =========================================================
   Odds maths (computed in the browser, never by the model)
   ========================================================= */
const Odds = {
  analyse(m) {
    const o = m.odds || {};
    const vals = [o.home, o.draw, o.away].map(Number);
    if (vals.some(v => !(v > 1))) return null;
    const raw = vals.map(v => 1 / v), sum = raw.reduce((a, b) => a + b, 0);
    const p = raw.map(r => r / sum * 100);
    let ou = null;
    if (m.over_under && Number(m.over_under.over) > 1 && Number(m.over_under.under) > 1) {
      const a = 1 / m.over_under.over, b = 1 / m.over_under.under, s = a + b;
      ou = { line: m.over_under.line, over: a / s * 100, under: b / s * 100 };
    }
    return { odds: vals, p, margin: (sum - 1) * 100, fav: ['Home', 'Draw', 'Away'][p.indexOf(Math.max(...p))], ou };
  }
};
async function shrinkImage(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}

/* =========================================================
   Shared view pieces
   ========================================================= */
const V = {};
const FAQ = [
  ['Can it predict who will win?', 'No. Virtual football results come from a random number generator, so nobody can predict them reliably. This tool reads the odds on your screenshot and shows what they imply, including the bookmaker margin.'],
  ['How do I get started?', 'Create a free account, buy a package, then upload a screenshot of the Instant Football lobby on the Predictions page and pick the fixtures to read.'],
  ['What happens to my screenshot?', 'It is sent securely to our server, read by the Claude API, and the extracted fixtures and odds are stored with your account. The image itself is not kept.'],
  ['Does paying more improve my chances?', 'No. Coins and diamonds only pay for readings. They do not change the odds or the outcome of any game.']
];
function head(back) {
  return `<div class="wrap pt-5 pb-3 flex items-center gap-3">
    ${back ? `<a href="${back}" class="w-10 h-10 rounded-full border border-[var(--line)] flex items-center justify-center" aria-label="Back">${ic('arrow-left')}</a>` : ''}
    <div class="font-display font-extrabold text-xl grad-text">${CONFIG.brand}</div></div>`;
}
function nav(active) {
  const items = [['dashboard', 'Home', 'house'], ['packages', 'Packages', 'package'], ['predict', 'Predictions', 'brain'], ['guide', 'Guide', 'book-open'], ['about', 'About', 'info'], ['profile', 'Profile', 'user-round']];
  return `<nav class="nav flex" aria-label="Main">${items.map(([r, l, i]) => `<a href="#/${r}" class="${active === r ? 'on' : ''}"><span class="pill">${ic(i)}</span>${l}</a>`).join('')}</nav>`;
}
function pageTitle(t, sub) { return `<div class="wrap pt-6"><h1 class="font-display font-bold text-3xl">${t}</h1>${sub ? `<p class="text-[var(--mute)] mt-1">${sub}</p>` : ''}</div>`; }
function field(label, name, type = 'text', ph = '', extra = '') {
  return `<div><label class="label" for="${name}">${label}</label><input class="input" id="${name}" name="${name}" type="${type}" placeholder="${ph}" ${extra}></div>`;
}
function pwField(label, name, auto) {
  return `<div><label class="label" for="${name}">${label}</label><div class="relative"><input class="input !pr-12" id="${name}" name="${name}" type="password" autocomplete="${auto}">
    <button type="button" data-action="togglepw" data-for="${name}" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full flex items-center justify-center text-slate-500" aria-label="Show password">${ic('eye')}</button></div></div>`;
}
function phoneField(label, name, ph) {
  return `<div><label class="label" for="${name}">${label}</label><div class="flex"><span class="flex items-center gap-1 px-3 rounded-l-[14px] border-[1.5px] border-r-0 border-[var(--line)] bg-slate-50 text-sm font-bold">+233</span><input class="input !rounded-l-none" id="${name}" name="${name}" type="tel" inputmode="tel" placeholder="${ph}"></div></div>`;
}
function stars(n, cls = '') { return [1, 2, 3, 4, 5].map(i => ic('star', (i <= n ? 'star-on' : 'star-off') + ' ' + cls)).join(''); }
const AV = ['linear-gradient(135deg,#a855f7,#6d28d9)', 'linear-gradient(135deg,#ec4899,#be185d)', 'linear-gradient(135deg,#f59e0b,#d97706)', 'linear-gradient(135deg,#10b981,#047857)', 'linear-gradient(135deg,#38bdf8,#0369a1)'];
const avatar = n => AV[[...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % AV.length];

function reviewsBlock() {
  const r = state.reviews, n = r.length;
  const avg = n ? (r.reduce((a, x) => a + x.rating, 0) / n).toFixed(1) : '-';
  const pos = n ? Math.round(r.filter(x => x.rating >= 4).length / n * 100) + '%' : '-';
  return `<section id="reviews" class="wrap mt-10">
    <div class="eyebrow">${ic('messages-square')} COMMUNITY</div>
    <h2 class="font-display font-bold text-3xl mt-1">What users are saying</h2>
    <div class="card mt-4 py-4 grid grid-cols-3 text-center divide-x divide-[var(--line)]">
      <div><div class="font-display font-bold text-xl">${avg} ${n ? ic('star', 'star-on inline') : ''}</div><div class="text-[11px] font-bold tracking-wider text-[var(--mute)]">AVERAGE RATING</div></div>
      <div><div class="font-display font-bold text-xl">${n}</div><div class="text-[11px] font-bold tracking-wider text-[var(--mute)]">REVIEWS</div></div>
      <div><div class="font-display font-bold text-xl">${pos}</div><div class="text-[11px] font-bold tracking-wider text-[var(--mute)]">RATED 4+</div></div>
    </div>
    <div class="mt-3 space-y-3">
      ${n ? r.map(x => `<div class="card p-4"><div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-full flex-none text-white font-display font-bold text-lg flex items-center justify-center" style="background:${avatar(x.display_name)}">${esc(x.display_name[0])}</div>
          <div class="flex-1 min-w-0"><div class="font-display font-bold">${esc(x.display_name)}</div><div class="text-xs text-[var(--mute)]">${fmtDate(x.created_at)}</div></div>
          <div class="flex">${stars(x.rating, '!w-4 !h-4')}</div></div>
          <p class="italic text-slate-700 mt-3 text-[15px]">&ldquo;${esc(x.comment)}&rdquo;</p></div>`).join('')
      : `<div class="card p-5 text-center"><div class="w-12 h-12 mx-auto rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center">${ic('message-square-plus', 'i-lg')}</div><div class="font-display font-bold mt-3">No reviews yet</div><p class="text-sm text-[var(--mute)] mt-1">Reviews come from real members only. Create an account and be the first to leave one.</p></div>`}
    </div>
  </section>`;
}

function contactBlock() {
  const s = CONFIG.support;
  return `<div class="rounded-3xl p-5 mt-4" style="background:#f3e8ff;border:1.5px solid #e9d5ff">
    <div class="font-display font-bold flex items-center gap-2">${ic('headset', 'text-purple-700')} Official contact</div>
    <div class="mt-3 space-y-2.5 text-[15px]">
      <a class="flex items-center gap-2" href="https://wa.me/${s.whatsapp}" target="_blank" rel="noopener"><span class="text-emerald-600">${ic('message-circle')}</span> WhatsApp: <b>+${s.whatsapp}</b></a>
      <a class="flex items-center gap-2" href="https://t.me/${s.telegram}" target="_blank" rel="noopener"><span class="text-sky-500">${ic('send')}</span> Telegram: <b>@${s.telegram}</b></a>
      <a class="flex items-center gap-2" href="mailto:${s.email}"><span class="text-purple-600">${ic('mail')}</span> Email: <b>${s.email}</b></a>
    </div></div>`;
}

function aboutBlock() {
  return `
  <section class="wrap mt-10 text-center">
    <span class="chip" style="color:#7c3aed;background:#faf5ff;border-color:#e9d5ff">${ic('badge-info')} ABOUT US</span>
    <h2 class="font-display font-bold text-[28px] mt-4 leading-tight">A clearer way to read virtual football odds</h2>
    <p class="text-[var(--mute)] mt-3 text-[15px]">We turn a screenshot of the lobby into a readable breakdown: the odds, the probabilities they imply, and the margin built into them.</p>
  </section>
  <section class="wrap mt-6">
    <div class="dark-card p-5 grid grid-cols-3 text-center gap-2">
      <div><div class="font-display font-bold text-2xl text-purple-300">3-way</div><div class="text-xs text-slate-400 mt-1">Odds read</div></div>
      <div><div class="font-display font-bold text-2xl text-emerald-300">Margin</div><div class="text-xs text-slate-400 mt-1">Shown per match</div></div>
      <div><div class="font-display font-bold text-2xl text-amber-300">Random</div><div class="text-xs text-slate-400 mt-1">Outcomes, always</div></div>
    </div>

   Router
   ========================================================= */
const PROTECTED = ['dashboard', 'packages', 'deposit', 'predict', 'profile'];
const GUEST_ONLY = ['login', 'register'];
let renderTok = 0;
async function render() {
  const tok = ++renderTok;
  const route = (location.hash.replace(/^#\/?/, '') || '').split('?')[0];
  if (route === 'reviews') return;
  let name = route === '' ? 'landing' : route;
  if (!V[name]) name = 'landing';
  const s = await session();
  if (tok !== renderTok) return;
  if (PROTECTED.includes(name) && !s) { location.hash = '#/login'; return; }
  if (GUEST_ONLY.includes(name) && s) { location.hash = '#/dashboard'; return; }
  let me = null;
  if (s) { me = await loadMe(); if (!me && PROTECTED.includes(name)) { toast('Could not load your account. Check the Supabase setup.'); } }
  if (['landing', 'about'].includes(name) && CONFIGURED) await loadReviews();
  if (tok !== renderTok) return;
  if (PROTECTED.includes(name) && !me) { $('#app').innerHTML = head('') + '<div class="wrap pt-6"><p class="text-[var(--mute)]">Account data is unavailable. Make sure schema.sql has been run in Supabase, then refresh.</p></div>'; return; }
  const html = V[name](me);
  const showNav = me && ['dashboard', 'packages', 'profile'].includes(name);
  $('#app').innerHTML = html + (showNav ? nav(name) : '') + (name === 'predict' && me ? nav('predict') : '');
  lucide.createIcons();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
sb.auth.onAuthStateChange(ev => {
  if (ev === 'PASSWORD_RECOVERY') location.hash = '#/reset';
  if (ev === 'SIGNED_OUT') { state.me = null; }
});

/* =========================================================
   Events
   ========================================================= */
function showErr(m) { const e = $('#formErr'); if (e) { e.textContent = m; e.classList.remove('hidden'); } }
async function go(fn) { try { await fn(); } catch (e) { toast(msg(e)); } }

document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  const fd = new FormData(form), type = form.dataset.form, btn = form.querySelector('[type=submit]');
  btn.disabled = true;
  try {
    if (type === 'register') {
      const live = await Auth.register({ first: fd.get('first') || '', other: fd.get('other') || '', last: fd.get('last') || '', email: fd.get('email') || '', phone: fd.get('phone') || '', password: fd.get('password') || '', confirm: fd.get('confirm') || '', referral: fd.get('referral') || '', terms: !!fd.get('terms') });
      if (!live) { showErr(''); toast('Check your email to confirm your account, then sign in.'); location.hash = '#/login'; return; }
      toast('Account created.');
    } else if (type === 'login') {
      await Auth.login(fd.get('identifier') || '', fd.get('password') || '', !!fd.get('remember'));
    } else if (type === 'reset') {
      const pw = fd.get('password') || '';
      if (pw.length < 6) throw 'Password must be at least 6 characters.';
      if (pw !== fd.get('confirm')) throw 'Passwords do not match.';
      const { error } = await sb.auth.updateUser({ password: pw }); if (error) throw error.message;
      toast('Password updated.');
    }
    location.hash = '#/dashboard'; render();
  } catch (err) { showErr(msg(err)); }
  btn.disabled = false;
});

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, v = b.dataset.v, u = state.me;
  switch (a) {
    case 'faq': b.closest('.faq').classList.toggle('open'); break;
    case 'scroll': e.preventDefault(); document.getElementById(b.dataset.target)?.scrollIntoView({ behavior: 'smooth' }); break;
    case 'togglepw': {
      const inp = document.getElementById(b.dataset.for), show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      b.innerHTML = ic(show ? 'eye-off' : 'eye'); b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); lucide.createIcons(); break;
    }
    case 'forgot': $('#forgotBox').classList.toggle('hidden'); break;
    case 'reset': go(async () => {
      const em = $('#resetEmail').value;
      if (!/^\S+@\S+\.\S+$/.test(em)) throw 'Enter a valid email address.';
      await Auth.reset(em); toast('If that email has an account, a reset link is on its way.');
    }); break;
    case 'bell': toast(u && u.tx.some(t => t.status === 'pending') ? 'You have a deposit awaiting confirmation.' : 'No new notifications.'); break;
    case 'soon': toast('This tool is coming soon.'); break;
    case 'packtab': state.packTab = v; render(); break;
    case 'buy': go(async () => {
      const { error } = await sb.rpc('buy_package', { p_id: b.dataset.id });
      if (error) throw error.message;
      toast('Package added to your account.'); render();
    }); break;
    case 'network': state.depNetwork = v; render(); break;
    case 'paid': go(async () => {
      const amount = Number($('#depAmount').value), sender = normPhone($('#depSender').value), name = $('#depName').value.trim();
      if (!(amount >= 1)) throw 'Enter a valid amount.';
      if (sender.length !== 9) throw 'Enter the MoMo number you paid from.';
      if (name.length < 2) throw 'Enter the name on that MoMo account.';
      const { error } = await sb.rpc('create_deposit', { p_network: state.depNetwork, p_amount: amount, p_sender_number: '+233' + sender, p_sender_name: name });
      if (error) throw error.message;
      toast('Payment reported. Awaiting admin confirmation.'); render();
    }); break;
    case 'refresh': render(); break;
    case 'filter': state.txFilter = v; render(); break;
    case 'star': state.reviewDraft = $('#reviewText')?.value || ''; state.reviewRating = Number(v); render(); break;
    case 'review': go(async () => {
      const text = ($('#reviewText').value || '').trim();
      if (!state.reviewRating) throw 'Choose a star rating.';
      if (text.length < 3) throw 'Write a short comment.';
      const { error } = await sb.rpc('submit_review', { p_rating: state.reviewRating, p_comment: text });
      if (error) throw error.message;
      state.reviewRating = 0; state.reviewDraft = ''; toast('Thanks. Your review is live.'); render();
    }); break;
    case 'logout': Auth.logout(); break;
    /* predictions flow */
    case 'ptab': P.kind = v; render(); break;
    case 'pickTier': P.tier = TIERS[P.kind].find(t => t.id === b.dataset.id); P.step = 'upload'; P.error = ''; render(); break;
    case 'changetier': P.step = 'tiers'; render(); break;
    case 'clearimg': P.dataUrl = null; P.error = ''; render(); break;
    case 'scan': runScan(); break;
    case 'togglepick': {
      const i = Number(b.dataset.i);
      if (P.picks.includes(i)) P.picks = P.picks.filter(x => x !== i);
      else if (P.picks.length < P.allowed) P.picks.push(i);
      else toast('Your tier unlocks ' + P.allowed + ' match' + (P.allowed > 1 ? 'es' : '') + '.');
      render(); break;
    }
    case 'reveal': go(async () => {
      const r = await callFn('scan-odds', { action: 'reveal', scan_id: P.scanId, picks: P.picks });
      P.result = r.matches; P.resultKind = r.kind; P.step = 'result'; render();
    }); break;
    case 'newread': Object.assign(P, { step: 'tiers', dataUrl: null, error: '', scanId: null, fixtures: [], picks: [], result: null }); render(); break;
  }
});

async function loadFile(file) {
  if (!file || !/^image\/(png|jpe?g|webp)$/.test(file.type)) return toast('Use a PNG, JPG or WEBP image.');
  try { P.dataUrl = await shrinkImage(file); P.error = ''; render(); } catch { toast('Could not open that image.'); }
}
document.addEventListener('change', e => { if (e.target.id === 'file') loadFile(e.target.files[0]); });
document.addEventListener('dragover', e => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); loadFile(e.dataTransfer.files[0]); } });

async function runScan() {
  const t = P.tier;
  P.step = 'scanning'; P.error = ''; await render();
  const phases = ['Uploading screenshot', 'Reading fixture rows', 'Extracting odds', 'Preparing your fixtures'];
  let pct = 0;
  const timer = setInterval(() => {
    pct = Math.min(90, pct + Math.random() * 6 + 2);
    const bar = $('#scanBar'), p = $('#scanPct'), s = $('#scanStatus');
    if (bar) bar.style.width = pct + '%'; if (p) p.textContent = Math.round(pct) + '%'; if (s) s.textContent = phases[Math.min(3, Math.floor(pct / 25))];
  }, 350);
  try {
    const r = await callFn('scan-odds', { action: 'scan', tier: t.id, image: P.dataUrl.split(',')[1] });
    clearInterval(timer);
    P.scanId = r.scan_id; P.fixtures = r.fixtures; P.allowed = r.allowed; P.picks = []; P.step = 'pick';
    // Auto-select when the tier covers every fixture found.
    if (P.fixtures.length <= P.allowed) P.picks = P.fixtures.map(f => f.i);
  } catch (err) {
    clearInterval(timer);
    P.error = msg(err); P.step = 'upload';
  }
  render();
}

render();
</script>
