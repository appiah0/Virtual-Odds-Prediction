<!DOCTYPE html>
<html lang="en">

<title>INSTANTVIRTUALS - Virtual football odds reader</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { display: ['Outfit','sans-serif'], sans: ['Plus Jakarta Sans','sans-serif'] } } } };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--p1:#a855f7;--p2:#7c3aed;--ink:#0f1226;--mute:#6b7280;--line:#e6e8f2;--soft:#f5f3ff}
*{-webkit-tap-highlight-color:transparent}
html,body{background:#fff;color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif}
.font-display{font-family:'Outfit',sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:0 20px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:22px}
.grad{background:linear-gradient(135deg,var(--p1),var(--p2))}
.grad-text{background:linear-gradient(90deg,#7c3aed,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Outfit',sans-serif;font-weight:700;border-radius:999px;padding:15px 24px;transition:transform .15s,box-shadow .15s;cursor:pointer;border:0}
.btn:active{transform:scale(.97)}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 10px 24px -8px rgba(124,58,237,.6)}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid #d6d9e6}
.btn-green{color:#fff;background:linear-gradient(135deg,#10b981,#047857)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:#f3f5fa;border:1px solid var(--line)}
.input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--p2);box-shadow:0 0 0 4px rgba(124,58,237,.12)}
.label{font-size:13px;font-weight:700;margin-bottom:6px;display:block;color:#374151}
.dark-card{background:linear-gradient(135deg,#0f1226,#1e1b4b);color:#fff;border-radius:24px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#7c3aed}
.i{width:18px;height:18px;stroke-width:2.2}
.i-lg{width:22px;height:22px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:10.5px;font-weight:600;color:#8b90a5}
.nav a.on{color:var(--p2)}
.nav a.on .pill{background:#ede9fe}
.pill{padding:4px 14px;border-radius:999px;display:flex}
.bar{height:9px;border-radius:999px;background:#eceef6;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;transition:width .5s}
.faq-a{display:none}.faq.open .faq-a{display:block}.faq.open .chev{transform:rotate(180deg)}
.chev{transition:transform .2s}
.drop{border:2px dashed #c4b5fd;background:var(--soft);border-radius:22px}
.drop.over{background:#ede9fe;border-color:var(--p2)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:#0f1226;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:100;transition:transform .3s;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.status-pending{background:#fef3c7;color:#92400e}.status-successful{background:#d1fae5;color:#065f46}.status-failed{background:#fee2e2;color:#991b1b}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid #c4b5fd;outline-offset:2px}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   CONFIG - edit these values for your deployment
   ========================================================= */
const CONFIG = {
  brand: 'INSTANTVIRTUALS',
  model: 'claude-sonnet-5-5',
  // Production: point this at your own serverless proxy that holds the API key.
  // Leave empty to call Anthropic directly using the key saved in Profile > Settings.
  proxyUrl: '',
  demoMode: true,            // shows "confirm / reject" buttons on pending deposits (no real admin backend)
  signupCoins: 20,           // free coins on registration so new users can try 2 standard reads
  scanCost: { standard: { coins: 10 }, detailed: { diamonds: 1 } },
  momo: {
    'MTN MoMo':     { number: '0XX XXX XXXX', name: 'Account name' },
    'Telecel Cash': { number: '0XX XXX XXXX', name: 'Account name' },
    'AT Money':     { number: '0XX XXX XXXX', name: 'Account name' }
  },
  coinPacks: [
    { id: 'starter', name: 'Starter Coins Pack', price: 350,  coins: 350 },
    { id: 'pro',     name: 'Pro Coins Pack',     price: 700,  coins: 800,  popular: true },
    { id: 'mega',    name: 'Mega Coins Pack',    price: 1200, coins: 1500 }
  ],
  diamondPacks: [
    { id: 'd1', name: 'Diamond Starter', price: 500,  diamonds: 5 },
    { id: 'd2', name: 'Diamond Plus',    price: 1000, diamonds: 12, popular: true },
    { id: 'd3', name: 'Diamond Max',     price: 2000, diamonds: 30 }
  ],
  support: { email: 'support@yourdomain.com' },
  lobbyUrl: 'https://www.sportybet.com/gh/'
};

/* =========================================================
   Helpers
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, c = '') => `<i data-lucide="${n}" class="i ${c}"></i>`;
const money = n => 'GH\u20B5 ' + Number(n || 0).toLocaleString('en-GH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uid = p => p + Math.random().toString(36).slice(2, 8).toUpperCase();
const fmtDate = t => new Date(t).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3000); }
function normPhone(p) { let d = String(p).replace(/\D/g, ''); if (d.startsWith('233')) d = d.slice(3); if (d.startsWith('0')) d = d.slice(1); return d; }
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('iv-salt:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

/* =========================================================
   Store - localStorage persistence
   ========================================================= */
const Store = {
  users() { try { return JSON.parse(localStorage.getItem('iv_users')) || []; } catch { return []; } },
  saveUsers(u) { localStorage.setItem('iv_users', JSON.stringify(u)); },
  saveUser(user) { const all = this.users(); const i = all.findIndex(x => x.id === user.id); if (i > -1) all[i] = user; else all.push(user); this.saveUsers(all); },
  session() {
    try { return JSON.parse(localStorage.getItem('iv_session')) || JSON.parse(sessionStorage.getItem('iv_session')); } catch { return null; }
  },
  setSession(id, remember) {
    this.clearSession();
    (remember ? localStorage : sessionStorage).setItem('iv_session', JSON.stringify({ id, t: Date.now() }));
  },
  clearSession() { localStorage.removeItem('iv_session'); sessionStorage.removeItem('iv_session'); },
  me() { const s = this.session(); return s ? this.users().find(u => u.id === s.id) || null : null; },
  apiKey() { return localStorage.getItem('iv_api_key') || ''; },
  setApiKey(k) { k ? localStorage.setItem('iv_api_key', k) : localStorage.removeItem('iv_api_key'); },
  rememberedLogin() { return localStorage.getItem('iv_last_login') || ''; },
  setRememberedLogin(v) { v ? localStorage.setItem('iv_last_login', v) : localStorage.removeItem('iv_last_login'); }
};

/* =========================================================
   Auth
   ========================================================= */
const Auth = {
  async register(f) {
    const email = f.email.trim().toLowerCase(), phone = normPhone(f.phone);
    if (!f.first.trim() || !f.last.trim()) throw 'Enter your first name and surname.';
    if (!/^\S+@\S+\.\S+$/.test(email)) throw 'Enter a valid email address.';
    if (phone.length !== 9) throw 'Enter a valid Ghana phone number (9 digits after +233).';
    if (f.password.length < 6) throw 'Password must be at least 6 characters.';
    if (f.password !== f.confirm) throw 'Passwords do not match.';
    if (!f.terms) throw 'Please accept the Terms & Conditions.';
    const users = Store.users();
    if (users.some(u => u.email === email)) throw 'An account with this email already exists.';
    if (users.some(u => u.phone === phone)) throw 'An account with this phone number already exists.';
    const user = {
      id: uid('U'), first: f.first.trim(), other: f.other.trim(), last: f.last.trim(), email, phone,
      hash: await sha(f.password), referredBy: f.referral.trim().toUpperCase(), refCode: 'IV' + Math.random().toString(36).slice(2, 7).toUpperCase(),
      created: Date.now(), wallet: { cash: 0, coins: CONFIG.signupCoins, diamonds: 0 }, tx: [], scans: []
    };
    Store.saveUser(user); Store.setSession(user.id, true);
    return user;
  },
  async login(identifier, password, remember) {
    const id = identifier.trim();
    const users = Store.users();
    const u = id.includes('@') ? users.find(x => x.email === id.toLowerCase()) : users.find(x => x.phone === normPhone(id));
    if (!u || u.hash !== await sha(password)) throw 'Incorrect phone/email or password.';
    Store.setSession(u.id, remember);
    Store.setRememberedLogin(remember ? id : '');
    return u;
  },
  logout() { Store.clearSession(); location.hash = '#/'; },
  resetByEmail(email) {
    const u = Store.users().find(x => x.email === email.trim().toLowerCase());
    // Reset links are email-only. A real deployment sends the email from a backend; the demo only confirms the request.
    return !!u;
  }
};

/* =========================================================
   Wallet
   ========================================================= */
const Wallet = {
  addTx(user, tx) { user.tx.unshift({ id: uid('TX'), ts: Date.now(), ...tx }); },
  startDeposit(user, { network, amount, senderNumber, senderName }) {
    const a = Number(amount);
    if (!a || a < 1) throw 'Enter a valid amount.';
    if (normPhone(senderNumber).length !== 9) throw 'Enter the MoMo number you paid from.';
    if (senderName.trim().length < 2) throw 'Enter the name on that MoMo account.';
    const tx = { id: uid('DEP'), ts: Date.now(), type: 'deposit', label: network + ' deposit', amount: a, status: 'pending', network, senderNumber, senderName: senderName.trim() };
    user.tx.unshift(tx); Store.saveUser(user); return tx;
  },
  setStatus(user, txId, status) {
    const tx = user.tx.find(t => t.id === txId); if (!tx || tx.status !== 'pending') return;
    tx.status = status;
    if (status === 'successful') user.wallet.cash += tx.amount;
    Store.saveUser(user);
  },
  buy(user, pack, kind) {
    if (user.wallet.cash < pack.price) throw 'Not enough wallet balance. Deposit first.';
    user.wallet.cash -= pack.price;
    if (kind === 'coins') user.wallet.coins += pack.coins; else user.wallet.diamonds += pack.diamonds;
    this.addTx(user, { type: 'purchase', label: pack.name, amount: -pack.price, status: 'successful' });
    Store.saveUser(user);
  }
};

/* =========================================================
   Odds maths (computed locally, never by the model)
   ========================================================= */
const Odds = {
  analyse(m) {
    const o = m.odds || {};
    const vals = [o.home, o.draw, o.away].map(Number);
    if (vals.some(v => !(v > 1))) return null;
    const raw = vals.map(v => 1 / v), sum = raw.reduce((a, b) => a + b, 0);
    const p = raw.map(r => r / sum * 100);
    let ou = null;
    if (m.over_under && Number(m.over_under.over) > 1 && Number(m.over_under.under) > 1) {
      const a = 1 / m.over_under.over, b = 1 / m.over_under.under, s = a + b;
      ou = { line: m.over_under.line, over: a / s * 100, under: b / s * 100, margin: (s - 1) * 100 };
    }
    const names = ['Home', 'Draw', 'Away'];
    return { odds: vals, p, margin: (sum - 1) * 100, fav: names[p.indexOf(Math.max(...p))], ou };
  }
};

/* =========================================================
   Scanner - Claude vision call
   ========================================================= */
const SYSTEM_PROMPT = `You read screenshots of virtual football betting lobbies. Extract only what is visible. Reply with JSON only, no prose, no code fences, in this exact shape:
{"matches":[{"league":string|null,"home":string,"away":string,"odds":{"home":number,"draw":number,"away":number},"over_under":{"line":number,"over":number,"under":number}|null}],"notes":string}
Rules: use team abbreviations exactly as shown. Use null for anything unreadable instead of guessing. Never invent odds. If the image is not a betting lobby, return {"matches":[],"notes":"Not a fixture screenshot."}.`;

async function shrinkImage(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}
async function callClaude(dataUrl) {
  const key = Store.apiKey();
  if (!CONFIG.proxyUrl && !key) throw 'Add your Claude API key in Profile > Settings first.';
  const headers = { 'content-type': 'application/json' };
  if (!CONFIG.proxyUrl) Object.assign(headers, { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' });
  const res = await fetch(CONFIG.proxyUrl || 'https://api.anthropic.com/v1/messages', {
    method: 'POST', headers,
    body: JSON.stringify({
      model: CONFIG.model, max_tokens: 2000, system: SYSTEM_PROMPT,
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: dataUrl.split(',')[1] } },
        { type: 'text', text: 'Extract every fixture row with its 1X2 odds and any over/under market shown.' }
      ] }]
    })
  });
  if (!res.ok) { let m = ''; try { m = (await res.json()).error?.message; } catch {} throw 'Claude API error (' + res.status + '). ' + (m || ''); }
  const data = await res.json();
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').replace(/```json|```/g, '').trim();
  try { return JSON.parse(text); } catch { throw 'Could not parse the reply. Try a clearer screenshot.'; }
}

/* =========================================================
   Views
   ========================================================= */
const V = {};
const FAQ = [
  ['Can it predict who will win?', 'No. Virtual football results come from a random number generator, so nobody can predict them reliably. This tool reads the odds on your screenshot and shows what they imply, including the bookmaker margin.'],
  ['How do I get started?', 'Create a free account, take a screenshot of the Instant Football lobby, and upload it on the Predictions page. You get free coins on sign-up to try a few reads.'],
  ['What happens to my screenshot?', 'It is sent to the Claude API to read the text and numbers, then shown back to you. This demo keeps only the extracted results in your browser.'],
  ['Does paying more improve my chances?', 'No. Coins and diamonds only pay for reads. They do not change the odds or the outcome of any game.']
];

function head(back) {
  return `<div class="wrap pt-5 pb-3 flex items-center gap-3">
    ${back ? `<a href="${back}" class="w-10 h-10 rounded-full border border-[var(--line)] flex items-center justify-center" aria-label="Back">${ic('arrow-left')}</a>` : ''}
    <div class="font-display font-extrabold text-xl grad-text">${CONFIG.brand}</div></div>`;
}

function aboutBlock() {
  return `
  <section class="wrap mt-10 text-center">
    <span class="chip" style="color:#7c3aed;background:#faf5ff;border-color:#e9d5ff">${ic('badge-info')} ABOUT US</span>
    <h2 class="font-display font-bold text-[28px] mt-4 leading-tight">A clearer way to read virtual football odds</h2>
    <p class="text-[var(--mute)] mt-3 text-[15px]">We turn a screenshot of the lobby into a readable breakdown: the odds, the probabilities they imply, and the margin built into them.</p>
  </section>
  <section class="wrap mt-6">
    <div class="dark-card p-5 grid grid-cols-3 text-center gap-2">
      <div><div class="font-display font-bold text-2xl text-purple-300">3-way</div><div class="text-xs text-slate-400 mt-1">Odds read</div></div>
      <div><div class="font-display font-bold text-2xl text-emerald-300">Margin</div><div class="text-xs text-slate-400 mt-1">Shown per match</div></div>
      <div><div class="font-display font-bold text-2xl text-amber-300">Random</div><div class="text-xs text-slate-400 mt-1">Outcomes, always</div></div>
    </div>
    <div class="mt-4 space-y-3">
      ${[['brain-circuit', '#f5f3ff', '#7c3aed', 'Vision-based odds reader', 'Claude reads the fixture rows and odds from your screenshot. The probability and margin maths is then done in your browser, not guessed by the model.'],
         ['shield-check', '#ecfdf5', '#059669', 'Honest by design', 'No win-rate claims and no invented reviews. We tell you plainly that results are random and that losses are part of the game.'],

    </div>
    <div class="card p-5 mt-4">
      <div class="font-display font-bold flex items-center gap-2">${ic('trophy', 'text-amber-500')} Supported virtual leagues</div>

      <div class="flex flex-wrap gap-2">${['England Premier|crown', 'Spain La Liga|star', 'Italy Serie A|shield', 'Germany Bundesliga|zap', 'Champions League|trophy', 'Euros|globe', 'Club World Cup|globe-2'].map(x => { const [n, i] = x.split('|'); return `<span class="chip">${ic(i, 'text-purple-600')}${n}</span>`; }).join('')}</div>
    </div>

      <div class="font-display font-bold flex items-center gap-2 mb-1">${ic('circle-help', 'text-purple-600')} Frequently asked questions</div>
      <div class="mt-3 space-y-2">${FAQ.map(([q, a]) => `<div class="faq card !rounded-2xl"><button data-action="faq" class="w-full flex justify-between items-center text-left p-4 font-semibold text-[15px]">${q}<span class="chev text-purple-600">${ic('chevron-down')}</span></button><p class="faq-a px-4 pb-4 text-sm text-[var(--mute)]">${a}</p></div>`).join('')}</div>
    </div>
    <div class="rounded-3xl p-5 mt-4" style="background:#f3e8ff;border:1.5px solid #e9d5ff">
      <div class="font-display font-bold flex items-center gap-2">${ic('headset', 'text-purple-700')} Contact</div>
      <p class="text-sm mt-3 flex items-center gap-2">${ic('mail', 'text-purple-600')} Email: <b>${CONFIG.support.email}</b></p>
    </div>
  </section>`;
}

function footer() {
  return `<footer class="wrap mt-8 pb-10">
    <div class="flex items-center justify-center gap-3 flex-wrap"><span class="font-display font-bold tracking-wide">VIRTUAL ODDS READER</span><span class="chip text-xs">18+ ONLY &middot; PLAY RESPONSIBLY</span></div>

    </div>
    <p class="text-center text-xs text-[var(--mute)] mt-5">&copy; 2026 Virtual Odds Reader Ghana. Not affiliated with SportyBet or any bookmaker.</p>
  </footer>`;
}

V.landing = () => `
  <div class="relative overflow-hidden">
    <div class="absolute -top-14 -right-16 w-72 h-72 rounded-full" style="background:radial-gradient(circle at 30% 30%,#e9d5ff,#c4b5fd)" aria-hidden="true"></div>
    <div class="wrap pt-5 relative">
      <div class="flex items-center gap-3 rounded-full px-4 py-3 border-[1.5px] border-purple-200" style="background:linear-gradient(90deg,#faf5ff,#f3e8ff)">
        <div class="w-9 h-9 grad rounded-xl flex items-center justify-center text-white">${ic('zap')}</div>
        <span class="font-display font-extrabold text-purple-700 tracking-wide">${CONFIG.brand}</span>
        <span class="w-px h-5 bg-purple-200"></span><span class="text-[13px] font-semibold text-[var(--mute)]">Virtual Football &middot; Odds Reader</span>
      </div>
      <h1 class="font-display font-bold text-[34px] leading-[1.15] mt-8">Upload an Instant Football screenshot and our AI <span class="grad-text">reads the odds</span> shown to explain what they imply &mdash; instantly.</h1>
      <p class="text-[var(--mute)] mt-4 text-[17px]">No hype, no guarantees. Just the maths behind the odds.</p>
      <div class="flex flex-wrap gap-2 mt-4">
        <span class="chip">${ic('zap', 'text-purple-600')} Quick read</span>
        <span class="chip">${ic('percent', 'text-purple-600')} Margin shown</span>
        <span class="chip" style="background:#fef2f2;color:#b91c1c;border-color:#fecaca">${ic('ban')} 18+ ONLY</span>
      </div>
      <div class="flex items-center gap-3 mt-7 flex-wrap">
        <a href="#/register" class="btn btn-primary">GET STARTED ${ic('wand-sparkles')}</a>
        <a href="#/login" class="btn btn-ghost">${ic('log-in')} SIGN IN</a>
        <a href="#how" data-action="scroll" data-target="how" class="font-semibold text-[var(--mute)] flex items-center gap-1">See how it works ${ic('chevron-right')}</a>

      <div class="flex justify-between"><span class="text-[var(--mute)]">Bookmaker margin (1X2)</span><b>${a.margin.toFixed(1)}%</b></div>

  </div>`;
}

        <input id="file" type="file" accept="image/png,image/jpeg,image/webp" class="hidden"></label>
      ${scan.error ? `<p class="text-sm font-semibold text-red-600 mt-3">${esc(scan.error)}</p>` : ''}
      <button data-action="scan" class="btn btn-primary w-full mt-4" ${scan.dataUrl ? '' : 'disabled'}>${ic('wand-sparkles')} Read the odds</button>
      ${scan.dataUrl ? '<button data-action="clearimg" class="btn btn-ghost w-full mt-2 !py-3 text-sm">Remove screenshot</button>' : ''}`}
  </div>
  ${scan.result ? `<section class="wrap mt-6 space-y-3">
    <h2 class="font-display font-bold text-xl">Results (${scan.result.matches.length} matches)</h2>
    ${scan.result.matches.map(m => resultCard(m, scan.resultTier === 'detailed')).join('')}
    <div class="rounded-2xl p-4 text-sm" style="background:#fffbeb;border:1.5px solid #fde68a;color:#78350f">${ic('triangle-alert', 'inline mr-1')} <b>Outcomes are random.</b> The shortest price loses often. These figures describe the odds, not the result. Only stake what you can afford to lose.</div>
  </section>` : ''}
  <div class="h-28"></div>`;
};

V.guide = u => `${u ? pageTitle('Guide', 'How to use the odds reader and read the results.') : head('#/') + '<div class="wrap"><h1 class="font-display font-bold text-3xl">Guide</h1></div>'}
  <div class="wrap mt-4 space-y-3 pb-32">
    ${[['Take a clear screenshot', 'Open the Instant Football lobby and capture all the fixture rows with their odds visible. Avoid glare and cropping.'],
       ['Upload it', 'Go to Predictions, choose Standard or Detailed, and upload the image. Reads that fail are not charged.'],
       ['Understand the percentages', 'Odds of 2.00 imply 50% before the margin. Because every bookmaker builds in a margin, the raw numbers add up to more than 100%. We remove it to show fair percentages.'],
       ['Remember it is random', 'Virtual results are generated randomly. A 60% favourite still loses 4 times out of 10.'],

  </div>${u ? nav('guide') : ''}`;

V.about = u => `${u ? '' : head('#/')}<div class="pb-28">${aboutBlock()}${footer()}</div>${u ? nav('about') : ''}`;

let txFilter = 'all';
V.profile = u => {
  const list = u.tx.filter(t => txFilter === 'all' || t.status === txFilter);
  return `${pageTitle('Profile')}
  <div class="wrap mt-4">
    <div class="card p-5">
      <div class="flex items-center gap-4"><div class="w-16 h-16 rounded-full grad text-white flex items-center justify-center font-display font-bold text-2xl">${esc(u.first[0] + u.last[0])}</div>
        <div><div class="font-display font-bold text-xl">${esc([u.first, u.other, u.last].filter(Boolean).join(' '))}</div><span class="chip text-xs !bg-emerald-50 !text-emerald-700 !border-emerald-200">${ic('badge-check')} Active member</span></div></div>
      <dl class="mt-4 text-sm space-y-2.5">
        <div class="flex justify-between"><dt class="text-[var(--mute)]">Email</dt><dd class="font-semibold">${esc(u.email)}</dd></div>
        <div class="flex justify-between"><dt class="text-[var(--mute)]">Phone</dt><dd class="font-semibold">+233 ${esc(u.phone)}</dd></div>
        <div class="flex justify-between"><dt class="text-[var(--mute)]">Account type</dt><dd class="font-semibold">Standard</dd></div>
        <div class="flex justify-between"><dt class="text-[var(--mute)]">Your referral code</dt><dd class="font-semibold">${u.refCode}</dd></div>
        <div class="flex justify-between"><dt class="text-[var(--mute)]">Referred by</dt><dd class="font-semibold">${u.referredBy || 'None'}</dd></div>
      </dl>
    </div>
    <div class="card p-5 mt-4">
      <div class="font-display font-bold flex items-center gap-2">${ic('key-round', 'text-purple-600')} Settings: Claude API key</div>
      <p class="text-xs text-[var(--mute)] mt-1">Stored only in this browser. For a public launch, use a server proxy (see <code>CONFIG.proxyUrl</code>) so the key is never exposed.</p>
      <input id="apiKey" type="password" class="input mt-3" placeholder="sk-ant-..." value="${esc(Store.apiKey())}">
      <div class="flex gap-2 mt-3"><button data-action="savekey" class="btn btn-primary flex-1 !py-3 text-sm">Save key</button><button data-action="clearkey" class="btn btn-ghost !py-3 text-sm">Clear</button></div>
    </div>
    <div class="card p-5 mt-4">
      <div class="font-display font-bold flex items-center gap-2 mb-3">${ic('receipt', 'text-purple-600')} Payment &amp; deposit history</div>
      <div class="flex gap-2 overflow-x-auto pb-2">${['all', 'pending', 'successful', 'failed'].map(f => `<button data-action="filter" data-v="${f}" class="chip capitalize flex-none ${txFilter === f ? '!bg-purple-600 !text-white !border-purple-600' : ''}">${f}</button>`).join('')}</div>
      <div class="mt-2 divide-y divide-[var(--line)]">
        ${list.length ? list.map(t => `<div class="py-3 flex items-center gap-3"><div class="flex-1 min-w-0"><div class="font-semibold text-sm truncate">${esc(t.label)}</div><div class="text-xs text-[var(--mute)]">${t.id} &middot; ${fmtDate(t.ts)}</div>
          ${CONFIG.demoMode && t.status === 'pending' ? `<div class="flex gap-3 mt-1 text-xs font-bold"><button data-action="txstatus" data-id="${t.id}" data-v="successful" class="text-emerald-700">Confirm (demo)</button><button data-action="txstatus" data-id="${t.id}" data-v="failed" class="text-red-600">Reject (demo)</button></div>` : ''}</div>
          <div class="text-right"><div class="font-bold text-sm">${t.amount < 0 ? '-' : '+'}${money(Math.abs(t.amount))}</div><span class="status-${t.status} text-[11px] font-bold px-2 py-0.5 rounded-full capitalize">${t.status}</span></div></div>`).join('') : '<p class="text-sm text-[var(--mute)] py-4 text-center">No transactions yet.</p>'}
      </div>
    </div>
    <div class="card p-5 mt-4">
      <div class="font-display font-bold flex items-center gap-2 mb-2">${ic('history', 'text-purple-600')} Recent reads</div>

    </div>
    <button data-action="logout" class="btn btn-ghost w-full mt-5 !text-red-600 !border-red-200">${ic('log-out')} Sign out of account</button>
  </div><div class="h-28"></div>`;
};

/* =========================================================
   Router
   ========================================================= */
const PROTECTED = ['dashboard', 'packages', 'deposit', 'predict', 'profile'];
const GUEST_ONLY = ['login', 'register'];
function render() {
  const route = (location.hash.replace(/^#\/?/, '') || '').split('?')[0];
  if (route === 'how') return;
  const u = Store.me();
  let name = route === '' ? 'landing' : route;
  if (!V[name]) name = 'landing';
  if (PROTECTED.includes(name) && !u) { location.hash = '#/login'; return; }
  if (GUEST_ONLY.includes(name) && u) { location.hash = '#/dashboard'; return; }
  if (name === 'landing' && u && !location.hash) { /* keep landing visible when logged in via home link */ }
  const html = V[name](u);
  const showNav = u && ['dashboard', 'packages', 'predict', 'profile'].includes(name);
  $('#app').innerHTML = html + (showNav ? nav(name) : '');
  lucide.createIcons();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* =========================================================
   Events (delegated)
   ========================================================= */
function showErr(msg) { const e = $('#formErr'); if (e) { e.textContent = msg; e.classList.remove('hidden'); } }

document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  const fd = new FormData(form), type = form.dataset.form;
  try {
    if (type === 'register') {
      await Auth.register({ first: fd.get('first') || '', other: fd.get('other') || '', last: fd.get('last') || '', email: fd.get('email') || '', phone: fd.get('phone') || '', password: fd.get('password') || '', confirm: fd.get('confirm') || '', referral: fd.get('referral') || '', terms: !!fd.get('terms') });
      toast('Account created. ' + CONFIG.signupCoins + ' free coins added.');
    } else {
      await Auth.login(fd.get('identifier') || '', fd.get('password') || '', !!fd.get('remember'));
    }
    location.hash = '#/dashboard'; render();
  } catch (err) { showErr(String(err)); }
});

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, v = b.dataset.v, u = Store.me();
  switch (a) {
    case 'faq': b.closest('.faq').classList.toggle('open'); break;
    case 'scroll': e.preventDefault(); document.getElementById(b.dataset.target)?.scrollIntoView({ behavior: 'smooth' }); break;
    case 'forgot': $('#forgotBox').classList.toggle('hidden'); break;
    case 'reset': {
      const em = $('#resetEmail').value;
      if (!/^\S+@\S+\.\S+$/.test(em)) return toast('Enter a valid email address.');
      Auth.resetByEmail(em);
      toast('If that email has an account, a reset link will be sent.'); break;
    }
    case 'bell': toast(u.tx.some(t => t.status === 'pending') ? 'You have a deposit awaiting confirmation.' : 'No new notifications.'); break;
    case 'packtab': packTab = v; render(); break;
    case 'buy': {
      const pack = [...CONFIG.coinPacks, ...CONFIG.diamondPacks].find(p => p.id === b.dataset.id);
      try { Wallet.buy(u, pack, packTab); toast(pack.name + ' purchased.'); render(); } catch (err) { toast(String(err)); }
      break;
    }
    case 'network': depNetwork = v; render(); break;
    case 'paid': {
      try {
        Wallet.startDeposit(u, { network: depNetwork, amount: $('#depAmount').value, senderNumber: $('#depSender').value, senderName: $('#depName').value });
        toast('Payment reported. Awaiting admin confirmation.'); render();
      } catch (err) { showErr(String(err)); }
      break;
    }
    case 'txstatus': Wallet.setStatus(u, b.dataset.id, v); toast(v === 'successful' ? 'Deposit confirmed. Wallet credited.' : 'Deposit marked failed.'); render(); break;
    case 'filter': txFilter = v; render(); break;
    case 'savekey': Store.setApiKey($('#apiKey').value.trim()); toast('API key saved on this device.'); break;
    case 'clearkey': Store.setApiKey(''); toast('API key removed.'); render(); break;
    case 'logout': Auth.logout(); break;
    case 'soon': toast('This tool is coming soon.'); break;
    case 'tier': scan.tier = v; render(); break;
    case 'clearimg': scan.dataUrl = null; scan.result = null; scan.error = ''; render(); break;
    case 'scan': runScan(u); break;
  }
});

async function loadFile(file) {
  if (!file || !/^image\/(png|jpe?g|webp)$/.test(file.type)) return toast('Use a PNG, JPG or WEBP image.');
  try { scan.dataUrl = await shrinkImage(file); scan.result = null; scan.error = ''; render(); } catch { toast('Could not open that image.'); }
}
document.addEventListener('change', e => { if (e.target.id === 'file') loadFile(e.target.files[0]); });
document.addEventListener('dragover', e => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); loadFile(e.dataTransfer.files[0]); } });

async function runScan(u) {
  const tier = scan.tier, cost = CONFIG.scanCost[tier];
  if (tier === 'standard' && u.wallet.coins < cost.coins) { scan.error = 'Not enough coins. Buy a coins pack first.'; return render(); }
  if (tier === 'detailed' && u.wallet.diamonds < cost.diamonds) { scan.error = 'Not enough diamonds. Buy a diamonds pack first.'; return render(); }
  scan.busy = true; scan.error = ''; scan.result = null; render();
  const phases = ['Uploading screenshot', 'Reading fixture rows', 'Extracting odds', 'Calculating implied probabilities'];
  let pct = 0;
  const timer = setInterval(() => {
    pct = Math.min(90, pct + Math.random() * 6 + 2);
    const bar = $('#scanBar'), p = $('#scanPct'), s = $('#scanStatus');
    if (bar) bar.style.width = pct + '%'; if (p) p.textContent = Math.round(pct) + '%'; if (s) s.textContent = phases[Math.min(3, Math.floor(pct / 25))];
  }, 350);
  try {
    const res = await callClaude(scan.dataUrl);
    clearInterval(timer);
    if (!res.matches || !res.matches.length) throw res.notes || 'No fixtures found in that image. You were not charged.';
    const fresh = Store.me();
    if (tier === 'standard') fresh.wallet.coins -= cost.coins; else fresh.wallet.diamonds -= cost.diamonds;
    fresh.scans.unshift({ id: uid('S'), ts: Date.now(), tier, matches: res.matches.length });
    fresh.scans = fresh.scans.slice(0, 20);
    Store.saveUser(fresh);
    scan.result = res; scan.resultTier = tier;
  } catch (err) {
    clearInterval(timer);
    scan.error = (typeof err === 'string' ? err : (err.message || 'Something went wrong.')) + ' You were not charged.';
  }
  scan.busy = false; render();
}

render();
</script>
</body>
</html>
