<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Round upload</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#faf5ff;color:#0f1226}
.h{font-family:'Outfit',sans-serif}
.card{background:#fff;border:1.5px solid #e6e8f2;border-radius:20px;padding:18px}
.input{width:100%;border:1.5px solid #e6e8f2;border-radius:14px;padding:12px 14px;font-size:15px;background:#fff;outline:none}
.input:focus{border-color:#7c3aed;box-shadow:0 0 0 4px rgba(124,58,237,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:700;border-radius:999px;padding:14px 22px;color:#fff;background:linear-gradient(135deg,#a855f7,#7c3aed);width:100%}
.btn:disabled{opacity:.5}
.drop{border:2px dashed #c4b5fd;border-radius:16px;background:#faf5ff;padding:14px;text-align:center;font-size:14px;color:#6b7280}
th,td{padding:6px 8px;text-align:right;font-size:13px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
</style>
</head>
<body>
<div class="max-w-[480px] mx-auto p-5 pb-16" id="app"></div>
<script>
const CFG = window.CONFIG;
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, flowType: 'pkce' } });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { h2hUrls: [], h2h: null, oddsUrl: null, resUrl: null, busy: false, out: null, err: '', stats: null, league: 'Germany' };

async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8);
}
async function callFn(body) {
  const { data } = await sb.auth.getSession();
  if (!data.session) throw 'Please sign in.';
  let res;
  try { res = await fetch(`${CFG.SUPABASE_URL}/functions/v1/bright-service`, {
    method: 'POST',
    headers: { 'content-type': 'application/json', apikey: CFG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + data.session.access_token },
    body: JSON.stringify(body)
  }); } catch { throw 'Could not reach the server (network, size or time limit). Check your connection and try again with fewer images.'; }
  let j = {}; try { j = await res.json(); } catch {}
  if (!res.ok) throw j.error || ('Request failed (' + res.status + ').');
  return j;
}

function loginView() {
  return `<h1 class="h text-2xl font-bold">Round upload</h1><p class="text-sm text-gray-500 mt-1">Developer sign-in</p>
  <div class="card mt-4 space-y-3">
    <input id="em" class="input" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" class="input" type="password" placeholder="Password" autocomplete="current-password">
    ${S.err ? `<p class="text-sm font-semibold text-red-600">${esc(S.err)}</p>` : ''}
    <button class="btn" data-a="login">Sign in</button></div>`;
}
function previewBox(id, label, url) {
  return `<label class="drop block cursor-pointer" for="${id}">${url ? `<img src="${url}" alt="" class="mx-auto rounded-xl" style="max-height:200px">` : label}
    <input id="${id}" type="file" accept="image/png,image/jpeg,image/webp" class="hidden"></label>`;
}
function modelCard() {
  const m = S.model;
  return `<div class="card mt-4"><div class="h font-bold">Monte Carlo backtest</div>
    <p class="text-sm text-gray-500 mt-1">Simulates 50,000 matches per fixture from the stored averages, then scores every method against the real results of the rounds you stored. It only measures; it does not predict the next round.</p>
    <button class="btn mt-3" data-a="model" ${S.busy ? 'disabled' : ''}>${S.busy && S.msg ? esc(S.msg) : 'Run backtest'}</button>
    ${S.modelErr ? `<p class="text-sm text-red-600 mt-2">${esc(S.modelErr)}</p>` : ''}
    ${m ? `<p class="text-sm mt-3">Tested on <b>${m.n}</b> fixtures with every input available (out of ${m.total} stored). Lower log loss and Brier are better; random guessing scores ${m.uniform.toFixed(3)} log loss.</p>
    <div class="overflow-x-auto mt-2"><table class="w-full text-xs"><thead><tr class="text-gray-500 text-left"><th>Method</th><th>Log loss</th><th>Brier</th><th>Right pick</th><th>vs odds (log loss, +/- 2 se)</th></tr></thead><tbody>
    ${m.rows.map((r) => `<tr class="border-t border-gray-100"><td class="font-semibold">${esc(r.name)}</td><td>${r.ll.toFixed(3)}</td><td>${r.brier.toFixed(3)}</td><td>${(r.acc * 100).toFixed(0)}%</td><td>${r.diff === null ? '-' : (r.diff >= 0 ? '+' : '') + r.diff.toFixed(3) + ' &plusmn; ' + (2 * r.se).toFixed(3)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="text-sm mt-3">${esc(m.verdict)}</p>` : ''}
  </div>`;
}
const poisson = (l) => { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; };
function monteCarlo(lh, la, n) { let h = 0, d = 0, a = 0; for (let i = 0; i < n; i++) { const x = poisson(lh), y = poisson(la); if (x > y) h++; else if (x < y) a++; else d++; } return [h / n, d / n, a / n]; }
const unit = (v) => { const t = v[0] + v[1] + v[2]; return v.map((x) => x / t); };
const num = (v) => (v === null || v === undefined || v === '' || isNaN(Number(v)) ? null : Number(v));
async function runModel() {
  S.busy = true; S.model = null; S.modelErr = ''; S.msg = 'Loading data...'; render();
  try {
    const { rows } = await callFn({ action: 'training' });
    const idx = { H: 0, D: 1, A: 2 };
    const use = [];
    for (const r of rows) {
      const oh = num(r.odds_home), od = num(r.odds_draw), oa = num(r.odds_away);
      const ph = num(r.prob_home), pd = num(r.prob_draw), pa = num(r.prob_away);
      const gh = num(r.ag_home_home) ?? num(r.ag_all_home), ga = num(r.ag_away_away) ?? num(r.ag_all_away);
      const nh = num(r.home_n_prev), na = num(r.away_n_prev);
      if (![oh, od, oa, ph, pd, pa, gh, ga].every((v) => v !== null && v > 0) || !(nh >= 3 && na >= 3)) continue;
      const rg = [(num(r.home_gf_ma5) + num(r.away_ga_ma5)) / 2, (num(r.away_gf_ma5) + num(r.home_ga_ma5)) / 2];
      if (!rg.every((v) => v > 0)) continue;
      use.push({ y: idx[r.result], odds: unit([1 / oh, 1 / od, 1 / oa]), sys: unit([ph, pd, pa]), lam: [Math.max(0.1, gh), Math.max(0.1, ga)], rlam: rg.map((v) => Math.max(0.1, v)) });
    }
    if (use.length < 20) throw 'Not enough complete fixtures yet (' + use.length + '). Upload more rounds with H2H screens.';
    const N = 50000, meth = { odds: [], sys: [], mc: [], mcr: [], blend: [], freq: [] };
    const freq = [0, 0, 0]; use.forEach((u) => freq[u.y]++); const fp = freq.map((x) => x / use.length);
    for (let i = 0; i < use.length; i++) {
      const u = use[i];
      if (i % 4 === 0) { S.msg = 'Simulating ' + i + ' / ' + use.length + '...'; render(); await new Promise((r) => setTimeout(r, 0)); }
      const c = monteCarlo(u.lam[0], u.lam[1], N), cr = monteCarlo(u.rlam[0], u.rlam[1], N);
      meth.odds.push(u.odds); meth.sys.push(u.sys); meth.mc.push(c); meth.mcr.push(cr);
      meth.blend.push(unit([(u.odds[0] + c[0]) / 2, (u.odds[1] + c[1]) / 2, (u.odds[2] + c[2]) / 2])); meth.freq.push(fp);
    }
    const clamp = (p) => Math.max(1e-6, p);
    const llOf = (P) => P.map((p, i) => -Math.log(clamp(p[use[i].y])));
    const base = llOf(meth.odds);
    const names = { odds: 'Odds, margin removed', sys: 'Game win probability (H2H screen)', mc: 'Monte Carlo from average goals', mcr: 'Monte Carlo from last-5 moving averages', blend: 'Blend: odds + Monte Carlo', freq: 'Always the overall H/D/A rates' };
    const out = Object.keys(names).map((k) => {
      const P = meth[k], l = llOf(P), n = l.length, mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
      const brier = mean(P.map((p, i) => [0, 1, 2].reduce((s2, j) => s2 + (p[j] - (use[i].y === j ? 1 : 0)) ** 2, 0)));
      const acc = mean(P.map((p, i) => (p.indexOf(Math.max(...p)) === use[i].y ? 1 : 0)));
      let diff = null, se = null;
      if (k !== 'odds') { const d = l.map((x, i) => x - base[i]); const md = mean(d); diff = md; se = Math.sqrt(d.reduce((s2, x) => s2 + (x - md) ** 2, 0) / (n - 1)) / Math.sqrt(n); }
      return { key: k, name: names[k], ll: mean(l), brier, acc, diff, se };
    });
    const better = out.filter((r) => r.diff !== null && r.diff + 2 * r.se < 0);
    const verdict = better.length
      ? 'On this data, ' + better.map((r) => r.name).join(' and ') + ' scored better than the odds by more than the noise. Confirm it on new rounds before trusting it.'
      : 'No method scored reliably better than the odds on this data. The differences are within noise, which is what you would expect if results are random. More rounds will tighten this.';
    S.model = { n: use.length, total: rows.length, uniform: Math.log(3), rows: out, verdict };
  } catch (er) { S.modelErr = String(er); }
  S.busy = false; S.msg = ''; render();
}
function statsTable() {
  const s = S.stats; if (!s) return '';
  return `<div class="card mt-4"><div class="h font-bold">Stored so far</div>
    <p class="text-sm text-gray-500 mt-1">${s.rounds} rounds, ${s.fixtures} fixtures, ${s.h2h ?? 0} H2H screens</p>
    ${s.teams.length ? `<div class="overflow-x-auto mt-3"><table class="w-full"><thead><tr class="text-gray-500"><th>Team</th><th>Fix</th><th>Fav</th><th>Fav won</th><th>Drew</th><th>Lost</th></tr></thead><tbody>
      ${s.teams.map((t) => `<tr class="border-t border-gray-100"><td class="font-semibold">${esc(t.team)}</td><td>${t.fixtures}</td><td>${t.times_favourite}</td><td>${t.favourite_won}</td><td>${t.favourite_drew}</td><td>${t.favourite_lost}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="text-sm text-gray-500 mt-2">No fixtures stored yet.</p>'}</div>` + h2hTable(s);
}
function h2hTable(s) {
  const r = s.recent_h2h || []; if (!r.length) return '';
  const g = (v) => (v === null || v === undefined ? '-' : v);
  return `<div class="card mt-4"><div class="h font-bold">Latest H2H stored</div><p class="text-sm text-gray-500 mt-1">The last ${r.length} H2H screens, as read from the images.</p>
    <div class="overflow-x-auto mt-3"><table class="w-full text-xs"><thead><tr class="text-gray-500 text-left"><th>Match</th><th>Form</th><th>Pos</th><th>Win prob</th><th>Prev</th><th>Avg pts</th><th>Goals (all/home/away)</th><th>Highest win</th></tr></thead><tbody>
    ${r.map((x) => { const ag = x.avg_goals || {}; const o = ag.overall || {}, h = ag.home || {}, a = ag.away || {}, hw = x.highest_win || {}; return `<tr class="border-t border-gray-100 align-top"><td class="font-semibold whitespace-nowrap">${esc(x.home)} v ${esc(x.away)}</td><td>${g(x.form_home)}/${g(x.form_away)}</td><td>${g(x.pos_home)}/${g(x.pos_away)}</td><td>${g(x.prob_home)}/${g(x.prob_draw)}/${g(x.prob_away)}</td><td>${g(x.prev_home_wins)}-${g(x.prev_draws)}-${g(x.prev_away_wins)}</td><td>${g(x.avg_points_home)}/${g(x.avg_points_away)}</td><td class="whitespace-nowrap">${g(o.home)}-${g(o.away)} / ${g(h.home)}-${g(h.away)} / ${g(a.home)}-${g(a.away)}</td><td>${g(hw.home)} / ${g(hw.away)}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;
}
function mainView() {
  const o = S.out;
  return `<div class="flex items-center justify-between"><h1 class="h text-2xl font-bold">Round upload</h1><button class="text-sm font-bold text-gray-500 underline" data-a="out">Sign out</button></div>
  <p class="text-sm text-gray-500 mt-1">One odds screenshot (1X2 tab) and one results screenshot for the same league and round.</p>
  <div class="card mt-4 space-y-3">
    <label class="text-sm font-bold" for="lg">League</label>
    <select id="lg" class="input"><option ${S.league === 'Germany' ? 'selected' : ''}>Germany</option><option ${S.league === 'Spain' ? 'selected' : ''}>Spain</option></select>
    <div class="text-sm font-bold">Odds screen</div>${previewBox('fo', 'Tap to choose the odds screenshot', S.oddsUrl)}
    <div class="text-sm font-bold">Results screen</div>${previewBox('fr', 'Tap to choose the results screenshot', S.resUrl)}
    <div class="text-sm font-bold">H2H stats screen <span class="font-normal text-gray-500">(optional, up to 10)</span></div>
    <label class="drop block cursor-pointer" for="fh">${S.h2hUrls.length
      ? `<div class="grid ${S.h2hUrls.length === 1 ? 'grid-cols-1' : 'grid-cols-3'} gap-2">${S.h2hUrls.map((u) => `<img src="${u}" alt="" class="mx-auto rounded-xl" style="max-height:${S.h2hUrls.length === 1 ? 200 : 120}px">`).join('')}</div><div class="text-xs mt-2">${S.h2hUrls.length} selected. Tap to change.</div>`
      : 'Tap to choose the H2H stats screenshots'}
      <input id="fh" type="file" multiple accept="image/png,image/jpeg,image/webp" class="hidden"></label>
    ${S.err ? `<p class="text-sm font-semibold text-red-600">${esc(S.err)}</p>` : ''}
    <button class="btn" data-a="go" ${S.busy || !S.oddsUrl || !S.resUrl ? 'disabled' : ''}>${S.busy ? (S.msg || 'Reading...') : 'Read and store round'}</button>
  </div>
  ${o ? `<div class="card mt-4"><div class="h font-bold text-emerald-700">${o.new_round ? 'Round stored' : 'Added to existing round'} &middot; ${esc(o.ref)}</div>
    <p class="text-sm mt-1">${esc(o.league)}: ${o.stored} fixtures stored (${o.odds_read} odds rows and ${o.results_read} result rows read${o.duplicates ? ', ' + o.duplicates + ' already stored' : ''}).</p>
    ${o.h2h.map((r) => `<p class="text-sm mt-1 ${r.ok ? (r.duplicate ? 'text-amber-700' : 'text-emerald-700') : 'text-red-600'}">H2H ${r.duplicate ? 'screenshot already uploaded before, skipped' : r.ok ? esc(r.fixture) + ': stored' + (r.linked ? ', linked to its fixture' : ', no matching fixture in this round') : esc(r.error)}</p>`).join('')}
    ${(o.not_in_league || []).length ? `<p class="text-sm mt-2 text-red-600">Skipped, teams not in ${esc(o.league)}: ${esc(o.not_in_league.join(', '))}</p>` : ''}
    ${o.unmatched_odds.length ? `<p class="text-sm mt-2 text-amber-700">Odds without a result: ${esc(o.unmatched_odds.join(', '))}</p>` : ''}
    ${o.unmatched_results.length ? `<p class="text-sm mt-1 text-amber-700">Results without odds: ${esc(o.unmatched_results.join(', '))}</p>` : ''}</div>` : ''}
  ${modelCard()}
  ${statsTable()}
  <button class="mt-4 text-sm font-bold text-purple-700 underline" data-a="stats">Refresh stats</button>`;
}
async function render() {
  const { data } = await sb.auth.getSession();
  $('#app').innerHTML = data.session ? mainView() : loginView();
}
async function loadStats() {
  try { S.stats = await callFn({ action: 'stats' }); S.err = ''; } catch (e) { S.err = String(e); }
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'login') {
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim().toLowerCase(), password: $('#pw').value });
    S.err = error ? 'Incorrect email or password.' : ''; if (!error) await loadStats(); render();
  } else if (a === 'out') { await sb.auth.signOut(); S.stats = null; S.out = null; render(); }
  else if (a === 'stats') { await loadStats(); render(); }
  else if (a === 'model') { runModel(); }
  else if (a === 'go') {
    S.busy = true; S.err = ''; S.out = null; S.league = $('#lg').value; render();
    const imgs = S.h2hUrls.map((u) => u.split(',')[1]);
    try {
      // 1) the round itself (odds + results): small request, creates the round reference
      S.out = await callFn({ action: 'ingest', league: S.league, odds_image: S.oddsUrl.split(',')[1], results_image: S.resUrl.split(',')[1] });
      S.out.h2h = [];
      S.oddsUrl = null; S.resUrl = null; render();
      // 2) the H2H screens, 2 per request, attached to that same round
      for (let i = 0; i < imgs.length; i += 2) {
        S.msg = 'Reading H2H ' + Math.min(i + 2, imgs.length) + ' of ' + imgs.length + '...'; render();
        try { const r = await callFn({ action: 'attach_h2h', round_id: S.out.round_id, h2h_images: imgs.slice(i, i + 2) }); S.out.h2h.push(...r.h2h); }
        catch (er) { S.out.h2h.push(...imgs.slice(i, i + 2).map(() => ({ ok: false, error: String(er) }))); }
      }
      S.h2hUrls = []; S.msg = ''; await loadStats();
    } catch (er) { S.err = String(er); S.msg = ''; }
    S.busy = false; render();
  }
});
document.addEventListener('change', async (e) => {
  if (e.target.id === 'fh') {
    const files = [...e.target.files].slice(0, 10); if (!files.length) return;
    S.league = $('#lg') ? $('#lg').value : S.league;
    try { S.h2hUrls = await Promise.all(files.map(shrink)); S.err = ''; } catch { S.err = 'Could not open one of those images.'; }
    render(); return;
  }
  if (e.target.id === 'fo' || e.target.id === 'fr') {
    const f = e.target.files[0]; if (!f) return;
    S.league = $('#lg') ? $('#lg').value : S.league;
    try { const u = await shrink(f); if (e.target.id === 'fo') S.oddsUrl = u; else S.resUrl = u; S.err = ''; } catch { S.err = 'Could not open that image.'; }
    render();
  }
});
(async () => { const { data } = await sb.auth.getSession(); if (data.session) await loadStats(); render(); })();
</script>
</body>
</html>
