name: instant-football-bot
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = scrape and pick only, no bets. 0 = place real bets"
        default: "0"
concurrency:
  group: instant-football-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt
      - name: Run bot
        env:
          SPORTYBET_PHONE: ${{ secrets.SPORTYBET_PHONE }}
          SPORTYBET_PASSWORD: ${{ secrets.SPORTYBET_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          INSTANT_URL: ${{ vars.INSTANT_URL }}
          DAILY_LOSS_LIMIT: "5.00"
          MAX_CONSEC_FAILS: "3"
        run: timeout 340m python instant_football_bot.py
      - name: Check live prediction accuracy
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python ml/accuracy_tracker.py --push-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-output
          path: |
            instant_football.db
            bot.log
            debug/
