name: Train XGBoost Models

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Train and evaluate XGBoost models
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: ml
        run: |
          python train.py
          python predict.py || true

      - name: Inspect model vs bookmaker divergence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: ml
        run: python inspect_divergence.py

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant-football-xgb-model
          path: ml/instant_football_xgb.joblib
